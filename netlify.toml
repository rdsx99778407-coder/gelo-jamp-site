# Configuração de publicação — Gelo Jamp
[build]
  publish = "public"
  functions = "netlify/functions"
  # Sem comando de build: a Netlify já instala as dependências do package.json sozinha.

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# A Netlify também serve a página sem ".html"
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Imagens mudam raramente: 7 dias de cache, revalidando em segundo plano por mais 1 dia.
# CSS e JS ficam no padrão da Netlify (sempre revalidam), porque os nomes dos arquivos não mudam a cada deploy.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
